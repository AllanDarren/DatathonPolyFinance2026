base_rule_text_fr: 'Catégorie {category} : poids de base {weight} pour un horizon {horizon_bucket}.'
position_weight_bonus:
- min_weight: 0.2
  add: 0.2
- min_weight: 0.1
  add: 0.1
modifiers:
- id: R_PREF_CONTROVERSY
  when:
  - field: profile.preferences.avoid_controversies
    op: ==
    value: true
  - field: item.controversy
    op: ==
    value: true
  add: 0.4
  text_fr: Tu souhaites éviter les controverses et cette nouvelle en signale une; cela ne prouve pas une faute.
- id: R_INTEREST_AI
  when:
  - field: profile.preferences.interests
    op: contains
    value: ai
  - field: item.category
    op: in
    value:
    - product
    - strategy_guidance
  - field: item.tickers
    op: contains
    value: NVDA
  add: 0.1
  text_fr: Cette nouvelle de produit ou de stratégie de NVDA rejoint ton intérêt pour l’IA; ce lien thématique est
    une hypothèse du prototype.
- id: R_CONCENTRATION
  when:
  - field: position_weight
    op: '>'
    limit_from: profile.limits.max_single_position
  add: 0.1
  text_fr: Le poids de ce titre dépasse le seuil de concentration déclaré; suivre ses nouvelles devient plus pertinent.
thresholds:
  show: 0.35
  high: 0.7
