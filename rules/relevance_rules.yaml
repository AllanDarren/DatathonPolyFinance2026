base_rule_text_fr: 'Catégorie {category} : poids de base {weight} pour un horizon {horizon_bucket}.'
position_weight_bonus:
- min_weight: 0.2
  add: 0.2
- min_weight: 0.1
  add: 0.1
modifiers:
- id: R_PREF_CONTROVERSY
  when:
  - field: profile.preferences.avoid_controversies
    op: ==
    value: true
  - field: item.controversy
    op: ==
    value: true
  add: 0.4
  text_fr: Tu souhaites éviter les controverses et cette nouvelle en signale une; cela ne prouve pas une faute.
- id: R_INTEREST_AI
  when:
  - field: profile.preferences.interests
    op: contains
    value: ai
  - field: item.category
    op: in
    value:
    - product
    - strategy_guidance
  - field: item.tickers
    op: contains
    value: NVDA
  add: 0.1
  text_fr: Cette nouvelle de produit ou de stratégie de NVDA rejoint ton intérêt pour l’IA; ce lien thématique est
    une hypothèse du prototype.
- id: R_CONCENTRATION
  when:
  - field: position_weight
    op: '>'
    limit_from: profile.limits.max_single_position
  add: 0.1
  text_fr: Le poids de ce titre dépasse le seuil de concentration déclaré; suivre ses nouvelles devient plus pertinent.
# Ciblage des nouvelles (core/news_targeting.py): fiabilité de la source, mention de l'entreprise,
# événement repris par plusieurs sources, sensibilité des obligations aux taux.
- id: R_SOURCE_PRIMARY
  when:
  - field: item.source_tier
    op: ==
    value: primary
  add: 0.05
  text_fr: Source primaire (l'entreprise, un régulateur ou une banque centrale) — information de première main.
- id: R_SOURCE_AGGREGATOR
  when:
  - field: item.source_tier
    op: ==
    value: aggregator
  add: -0.1
  text_fr: Source d'opinion ou agrégateur — à recouper avec une source primaire ou la presse établie.
- id: R_MENTION_PASSING
  when:
  - field: item.mention
    op: ==
    value: none
  add: -0.15
  text_fr: Le titre ne nomme pas directement l'entreprise que tu détiens — le lien avec ta position est peut-être
    indirect.
- id: R_MULTI_SOURCE
  when:
  - field: item.cluster_size
    op: '>='
    value: 3
  add: 0.05
  text_fr: Plusieurs sources rapportent ce même événement (regroupées en une seule carte).
- id: R_RATES_BOND
  when:
  - field: item.category
    op: ==
    value: macro
  - field: position.asset_class
    op: ==
    value: bond_etf
  add: 0.1
  text_fr: Tu détiens un FNB d'obligations — les décisions de taux et l'inflation influencent directement son prix.
thresholds:
  show: 0.35
  high: 0.7
