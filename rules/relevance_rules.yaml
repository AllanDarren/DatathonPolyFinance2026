version: 1
base_weights:
  short:
    earnings_results: 0.55
    dividend: 0.8
    strategy_guidance: 0.35
    regulation_legal: 0.75
    controversy: 0.65
    management_change: 0.45
    merger_acquisition: 0.5
    macro: 0.85
    analyst_opinion: 0.15
    daily_price: 0.05
    rumor_hype: 0.02
    product: 0.25
  medium:
    earnings_results: 0.65
    dividend: 0.6
    strategy_guidance: 0.65
    regulation_legal: 0.7
    controversy: 0.65
    management_change: 0.55
    merger_acquisition: 0.65
    macro: 0.65
    analyst_opinion: 0.2
    daily_price: 0.05
    rumor_hype: 0.02
    product: 0.5
  long:
    earnings_results: 0.65
    dividend: 0.3
    strategy_guidance: 0.75
    regulation_legal: 0.65
    controversy: 0.6
    management_change: 0.55
    merger_acquisition: 0.7
    macro: 0.45
    analyst_opinion: 0.15
    daily_price: 0.05
    rumor_hype: 0.02
