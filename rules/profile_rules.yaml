version: 1
horizon_buckets:
- id: short
  max_years: 5
- id: medium
  max_years: 12
- id: long
  max_years: 100
risk_from_points:
- max_points: 3
  value: low
- max_points: 6
  value: low_moderate
- max_points: 9
  value: moderate
- max_points: 99
  value: high
limits_by_risk:
  low:
    max_single_position: 0.08
    max_high_vol_share: 0.05
  low_moderate:
    max_single_position: 0.1
    max_high_vol_share: 0.1
  moderate:
    max_single_position: 0.15
    max_high_vol_share: 0.25
  high:
    max_single_position: 0.25
    max_high_vol_share: 0.6
inconsistency_checks:
- id: I_HIGH_RISK_SHORT
  when:
  - field: risk_tolerance
    op: ==
    value: high
  - field: horizon_years
    op: <=
    value: 5
  text_fr: 'Tolérance élevée et horizon de cinq ans ou moins : ces réponses sont en tension.'
- id: I_PRESERVATION_HIGH
  when:
  - field: risk_tolerance
    op: ==
    value: high
  - field: objective
    op: ==
    value: capital_preservation
  text_fr: La recherche de préservation du capital est en tension avec la tolérance élevée déclarée.
